[project]
name = "sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aureateAnatidae", email = "34411014+aureateAnatidae@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "braindecode>=1.8.1",
    "matplotlib>=3.11.1",
    "mne>=1.12.1",
    "mne-bids>=0.19.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "skorch>=1.4.0",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torcheeg>=1.1.2",
]

[project.scripts]
sandbox = "sandbox:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
